[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "forge-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "asyncpg>=0.29,<1.0",
    "pydantic-settings>=2.0,<3.0",
    "alembic>=1.13,<2.0",
    "langchain-core>=1.6,<2",
    "langchain-openai>=1.6,<2",
    "langgraph==1.2.21",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx",
    "langchain==1.4.10",
]

[tool.setuptools.packages.find]
include = ["app*"]

# Coverage: SQLAlchemy's async engine runs on greenlets. Without `greenlet` here coverage drops every line that follows
# an `await` on the database (it reported ~3% too little and invented "regressions" during ADR-003/C3).
# Reproduce the cleanup measurement:  pytest --cov=app --cov-report=json:cov.json tests   then
#   python scripts/inventory/coverage_diff.py before.json after.json
[tool.coverage.run]
source = ["app"]
concurrency = ["greenlet", "thread"]
