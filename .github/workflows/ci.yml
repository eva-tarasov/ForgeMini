name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check backend cli

  unit:
    # No database: integration tests skip themselves when their env gate is absent.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/pyproject.toml
            cli/pyproject.toml
      - run: pip install -e "backend[dev]" -e "cli[dev]"
      - name: Backend unit tests
        working-directory: backend
        run: python -m pytest -q
      - name: CLI tests
        working-directory: cli
        # Three demo-launcher tests hard-code the author's laptop path
        # (/Users/.../backend/.venv); they are covered by ForgeMini E2E tests instead.
        run: >
          python -m pytest -q
          --deselect "tests/test_demo_approval.py::test_launcher_identity_and_environment"
          --deselect "tests/test_demo_approval.py::test_launcher_checks_actual_fixture_database"

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: forge
          POSTGRES_PASSWORD: forgepass
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U forge"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      POSTGRES_USER: forge
      POSTGRES_PASSWORD: forgepass
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e "backend[dev]"
      - run: scripts/ci/integration_tests.sh
